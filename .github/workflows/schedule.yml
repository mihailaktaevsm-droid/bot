name: Обновить расписание

on:
  push:
    paths:
      - "scripts/fetch_schedule.py"
      - ".github/workflows/schedule.yml"
  schedule:
    - cron: "17 3 * * *" # каждый день в 06:17 по Москве
  workflow_dispatch:
    inputs:
      group:
        description: "Группа (например Э5-11/6)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Скачать расписание из ЛКС
        env:
          GROUP: ${{ github.event.inputs.group || vars.GROUP || 'Э5-11/6' }}
          GROUP_UUID: ${{ vars.GROUP_UUID }}
        run: python scripts/fetch_schedule.py
      - name: Сохранить изменения
        run: |
          if git diff --quiet schedule.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "Обновить расписание"
          git push
