name: Утренняя сводка в Telegram

on:
  schedule:
    - cron: "41 3 * * *" # каждый день в 06:41 по Москве (GitHub может задержать на 5–20 минут)
  workflow_dispatch:

permissions:
  contents: write # чтобы запомнить новых получателей в telegram_chats.txt

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Настроить кнопку «Открыть» в боте
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/setup_bot.py
      - name: Отправить сводку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HIDDEN: ${{ vars.HIDDEN || 'ФКиС,УТП МТ13' }}
        run: python scripts/daily_digest.py
      - name: Запомнить новых получателей
        if: always()
        run: |
          if [ -z "$(git status --porcelain telegram_chats.txt)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_chats.txt
          git commit -m "Новый получатель утренней сводки"
          git pull --rebase
          git push
